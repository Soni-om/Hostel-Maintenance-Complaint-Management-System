<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — HostelCare</title>
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body style="justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 1rem;">

  <div class="card" style="width: 100%; max-width: 520px;">
    <div class="text-center" style="margin-bottom: 2rem;">
      <a href="/" class="brand" style="justify-content: center; margin-bottom: 0.75rem;">
        <span class="brand-icon">H</span>
        <span>HostelCare</span>
      </a>
      <h2>Student Registration</h2>
      <p class="text-muted text-sm">Register your hostel residency to submit & track maintenance complaints</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="e.g. John Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">College Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="e.g. john.doe@campus.edu" required>
      </div>

      <div class="grid grid-cols-2" style="gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="hostel_block">Hostel Block</label>
          <select id="hostel_block" class="form-select" required>
            <option value="" disabled selected>Select Block</option>
            <option value="Block A">Block A (North Wing)</option>
            <option value="Block B">Block B (South Wing)</option>
            <option value="Block C">Block C (East Wing)</option>
            <option value="Block D">Block D (West Wing)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="room_number">Room Number</label>
          <input type="text" id="room_number" class="form-input" placeholder="e.g. B-204" required>
        </div>
      </div>

      <div class="grid grid-cols-2" style="gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-input" placeholder="e.g. +91 9876543210" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" minlength="6" required>
        </div>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block">Complete Registration</button>
      </div>
    </form>

    <div class="text-center" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--color-border);">
      <p class="text-sm text-muted" style="margin-bottom: 0.5rem;">
        Already registered? <a href="/pages/auth/login.html">Sign In Here</a>
      </p>
      <p class="text-xs text-muted" style="margin-bottom: 1rem;">
        <a href="/">← Return to Main Portal</a>
      </p>

      <!-- Live Backend Status -->
      <div id="auth-status" style="font-size: var(--font-xs); color: var(--color-text-muted); display: flex; align-items: center; justify-content: center; gap: 6px;">
        <span id="auth-dot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-light);"></span>
        <span id="auth-label">Checking API...</span>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    async function checkStatus() {
      const dot = document.getElementById('auth-dot');
      const label = document.getElementById('auth-label');
      try {
        const data = await window.Api.checkHealth();
        if (data.database && data.database.status === 'connected') {
          dot.style.background = 'var(--color-success)';
          dot.style.boxShadow = '0 0 6px rgba(22, 163, 74, 0.6)';
          label.textContent = `Backend & MySQL Online (${data.database.latencyMs}ms)`;
        } else {
          dot.style.background = 'var(--color-warning)';
          label.textContent = 'API Online (Database Disconnected)';
        }
      } catch {
        dot.style.background = 'var(--color-danger)';
        label.textContent = 'Backend Offline';
      }
    }
    document.addEventListener('DOMContentLoaded', checkStatus);

    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      Utils.showToast('Registration API endpoint will be integrated in Session 5.', 'info');
    });
  </script>
</body>
</html>
