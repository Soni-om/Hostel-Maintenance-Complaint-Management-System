<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — HostelCare</title>
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body style="justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 1rem;">

  <main class="card" style="width: 100%; max-width: 440px;">
    <div class="text-center" style="margin-bottom: 2rem;">
      <a href="/" class="brand" style="justify-content: center; margin-bottom: 0.75rem;">
        <span class="brand-icon">H</span>
        <span>HostelCare</span>
      </a>
      <h2>Welcome Back</h2>
      <p class="text-muted text-sm">Sign in to access your role-based maintenance portal</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Institutional Email</label>
        <input type="email" id="email" class="form-input" placeholder="e.g. rollnumber@hostel.edu" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </div>
    </form>

    <div class="text-center" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--color-border);">
      <p class="text-sm text-muted" style="margin-bottom: 0.5rem;">
        New student resident? <a href="/pages/auth/register.html">Register Account</a>
      </p>
      <p class="text-xs text-muted" style="margin-bottom: 1rem;">
        <a href="/">← Return to Main Portal</a>
      </p>

      <!-- Live Backend Status -->
      <div id="auth-status" style="font-size: var(--font-xs); color: var(--color-text-muted); display: flex; align-items: center; justify-content: center; gap: 6px;">
        <span id="auth-dot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-light);"></span>
        <span id="auth-label">Checking API...</span>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    async function checkStatus() {
      const dot = document.getElementById('auth-dot');
      const label = document.getElementById('auth-label');
      try {
        const data = await window.Api.checkHealth({ silent: true });
        if (data.database && data.database.status === 'connected') {
          dot.style.background = 'var(--color-success)';
          dot.style.boxShadow = '0 0 6px rgba(22, 163, 74, 0.6)';
          label.textContent = `Backend & MySQL Online (${data.database.latencyMs}ms)`;
        } else {
          dot.style.background = 'var(--color-warning)';
          dot.style.boxShadow = 'none';
          label.textContent = 'API Online (Database Disconnected)';
        }
      } catch (err) {
        dot.style.boxShadow = 'none';
        if (err.status === 503) {
          dot.style.background = 'var(--color-warning)';
          label.textContent = 'Service Degraded (DB Offline)';
        } else {
          dot.style.background = 'var(--color-danger)';
          label.textContent = 'Backend Offline';
        }
      }
    }
    document.addEventListener('DOMContentLoaded', checkStatus);

    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing In...';

        const result = await window.Api.post('/auth/login', { email, password });

        // Save JWT authentication token
        window.Api.setToken(result.token);

        // Save safe user profile in localStorage
        if (typeof localStorage !== 'undefined' && result.user) {
          localStorage.setItem(window.CONFIG?.USER_KEY || 'hostelcare_user', JSON.stringify(result.user));
        }

        Utils.showToast('Login successful! Redirecting...', 'success');
        loginForm.reset();

        // Redirect according to user role
        setTimeout(() => {
          const role = (result.user?.role || '').toLowerCase();
          if (role === 'student') {
            window.location.href = '/pages/student/dashboard.html';
          } else if (role === 'staff') {
            window.location.href = '/pages/staff/dashboard.html';
          } else if (role === 'admin') {
            window.location.href = '/pages/admin/dashboard.html';
          } else {
            window.location.href = '/';
          }
        }, 1000);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
        const errorMsg = err.data?.message || err.message || 'Login failed. Please check your credentials.';
        Utils.showToast(errorMsg, 'danger');
      }
    });
  </script>
</body>
</html>
